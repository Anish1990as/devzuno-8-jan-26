{% extends 'base.html' %}
{% block content %}

<div class="container" style="max-width: 650px; margin: 40px auto;">
  <div style="background: #fff; padding: 24px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08);">

    <h2 style="margin-bottom: 10px;">Create Order</h2>
    <p style="margin-top: 0; color: #666;">Select plan and apply coupon code.</p>

    <!-- ✅ PLAN DETAILS -->
    <div style="margin-top: 16px; padding: 14px; border: 1px solid #eee; border-radius: 12px;">
      <p style="margin: 0; font-size: 14px; color: #666;">Plan</p>
      <h3 style="margin: 6px 0;" id="planName">Starter Plan</h3>

      <p style="margin: 0; font-size: 14px; color: #666;">Base Price</p>
      <h3 style="margin: 6px 0;">₹ <span id="baseAmount">5499</span></h3>
    </div>

    <!-- ✅ COUPON APPLY -->
    <div style="margin-top: 18px;">
      <label style="font-weight: 600;">Apply Coupon</label>

      <div style="display: flex; gap: 10px; margin-top: 10px;">
        <input
          type="text"
          id="couponCode"
          placeholder="Enter coupon code"
          style="flex: 1; padding: 10px; border-radius: 10px; border: 1px solid #ccc; outline: none;"
        />
        <button
          type="button"
          id="applyCouponBtn"
          style="padding: 10px 16px; border-radius: 10px; border: none; background: #2563eb; color: white; font-weight: 600; cursor: pointer;"
        >
          Apply
        </button>
      </div>

      <p id="couponMsg" style="margin-top: 10px; font-size: 14px;"></p>
    </div>

    <!-- ✅ PRICE SUMMARY -->
    <div style="margin-top: 18px; padding: 14px; border: 1px solid #eee; border-radius: 12px;">
      <p style="margin: 0; display: flex; justify-content: space-between;">
        <span>Discount</span>
        <b>₹ <span id="discountAmount">0</span></b>
      </p>

      <p style="margin: 10px 0 0; display: flex; justify-content: space-between; font-size: 18px;">
        <span>Final Amount</span>
        <b>₹ <span id="finalAmount">5499</span></b>
      </p>
    </div>

    <!-- ✅ ORDER BUTTON -->
    <div style="margin-top: 20px;">
      <button
        type="button"
        id="placeOrderBtn"
        style="width: 100%; padding: 12px; border-radius: 12px; border: none; background: #16a34a; color: #fff; font-weight: 700; font-size: 16px; cursor: pointer;"
      >
        Place Order
      </button>

      <p style="margin-top: 10px; font-size: 13px; color: #777; text-align: center;">
        After confirmation we will contact you on WhatsApp ✅
      </p>
    </div>

  </div>
</div>

<script>
  // ✅ Base price (abhi fix hai, baad me dynamic kar denge)
  let basePrice = 5499;

  // ✅ Show initial amounts
  document.getElementById("baseAmount").innerText = basePrice;
  document.getElementById("finalAmount").innerText = basePrice;

  function getCSRFToken() {
    const name = "csrftoken";
    const cookies = document.cookie.split(";");
    for (let i = 0; i < cookies.length; i++) {
      const c = cookies[i].trim();
      if (c.startsWith(name + "=")) {
        return c.substring(name.length + 1);
      }
    }
    return "";
  }

  document.getElementById("applyCouponBtn").addEventListener("click", function () {
    const code = document.getElementById("couponCode").value.trim();
    const msg = document.getElementById("couponMsg");

    if (!code) {
      msg.innerHTML = "<span style='color:red; font-weight:600;'>Please enter coupon code!</span>";
      return;
    }

    msg.innerHTML = "<span style='color:#666;'>Applying coupon...</span>";

    const formData = new FormData();
    formData.append("code", code);
    formData.append("amount", basePrice);

    fetch("/billing/apply-coupon/", {
      method: "POST",
      headers: {
        "X-CSRFToken": getCSRFToken()
      },
      body: formData
    })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        document.getElementById("discountAmount").innerText = data.discount;
        document.getElementById("finalAmount").innerText = data.final_amount;

        msg.innerHTML = "<span style='color:green; font-weight:700;'>" + data.message + "</span>";
      } else {
        document.getElementById("discountAmount").innerText = 0;
        document.getElementById("finalAmount").innerText = basePrice;

        msg.innerHTML = "<span style='color:red; font-weight:700;'>" + data.message + "</span>";
      }
    })
    .catch(() => {
      msg.innerHTML = "<span style='color:red; font-weight:700;'>Something went wrong!</span>";
    });
  });

  // ✅ Place Order button (abhi demo)
  document.getElementById("placeOrderBtn").addEventListener("click", function () {
    const finalAmount = document.getElementById("finalAmount").innerText;
    alert("✅ Order Created!\nFinal Amount: ₹" + finalAmount + "\n(Next: Payment/WhatsApp)");
  });
</script>

{% endblock %}
