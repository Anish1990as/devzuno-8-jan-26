{% extends 'base.html' %}
{% block content %}

<style>
  body {
    background: linear-gradient(135deg, #0f172a, #1e293b);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Poppins", sans-serif;
  }

  .reset-card {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 20px;
    padding: 2.5rem;
    width: 400px;
    color: #f8fafc;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
  }

  .reset-card h2 {
    text-align: center;
    font-weight: 600;
    margin-bottom: 1rem;
    letter-spacing: 0.5px;
    color: #f1f5f9;
  }

  .reset-card p {
    text-align: center;
    font-size: 0.95rem;
    color: #cbd5e1;
    margin-bottom: 1.5rem;
  }

  input[type="email"] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: none;
    outline: none;
    background: rgba(255, 255, 255, 0.15);
    color: #fff;
    font-size: 15px;
    margin-bottom: 1rem;
  }

  input[type="email"]:focus {
    background: rgba(255, 255, 255, 0.25);
    box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.4);
  }

  .btn-reset {
    background: linear-gradient(90deg, #2563eb, #1d4ed8);
    color: white;
    border: none;
    width: 100%;
    padding: 0.6rem;
    border-radius: 10px;
    font-weight: 500;
    transition: all 0.3s ease;
  }

  .btn-reset:hover {
    background: linear-gradient(90deg, #1d4ed8, #2563eb);
    transform: translateY(-2px);
  }

  .back-login {
    text-align: center;
    margin-top: 1rem;
  }

  .back-login a {
    color: #93c5fd;
    text-decoration: none;
    font-size: 0.95rem;
    transition: 0.3s;
  }

  .back-login a:hover {
    color: #60a5fa;
    text-decoration: underline;
  }

  .alert {
    background: rgba(34, 197, 94, 0.15);
    border: 1px solid rgba(34, 197, 94, 0.4);
    color: #86efac;
    border-radius: 10px;
    padding: 10px;
    font-size: 0.9rem;
    margin-bottom: 1rem;
    text-align: center;
  }
</style>

<div class="reset-card">
  <h2>Forgot Password</h2>
  <p>Enter your registered email address, and we’ll send you a password reset link.</p>

  {% if messages %}
    {% for m in messages %}
      <div class="alert">{{ m }}</div>
    {% endfor %}
  {% endif %}

  <form method="post">
    {% csrf_token %}
    {{ form.email }}
    <button type="submit" class="btn-reset">Send Reset Link</button>
    <div class="back-login">
      <a href="/client/login/">← Back to Login</a>
    </div>
  </form>
</div>

{% endblock %}
