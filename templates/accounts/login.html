{% extends 'base.html' %}
{% block content %}

<style>
  body.login-page {
    background: radial-gradient(circle at top left, #38bdf8 0%, transparent 45%),
                radial-gradient(circle at bottom right, #2563eb 0%, transparent 45%),
                linear-gradient(135deg, #0b1220, #0f172a) !important;
    color: #e2e8f0;
  }

  .login-wrapper {
    min-height: calc(100vh - var(--dvz-nav-height) - var(--dvz-footer-height));
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px 12px;
  }

  .login-card {
    background: rgba(15, 23, 42, 0.75);
    backdrop-filter: blur(18px);
    border: 1px solid rgba(56, 189, 248, 0.25);
    border-radius: 22px;
    padding: 2.4rem;
    width: 390px;
    color: #f8fafc;
    box-shadow: 0 10px 35px rgba(0, 0, 0, 0.5);
    position: relative;
    overflow: hidden;
  }

  .login-card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(120deg, rgba(56,189,248,0.18), rgba(37,99,235,0.18));
    opacity: 0.7;
    z-index: 0;
    pointer-events: none;
  }

  .login-card > * {
    position: relative;
    z-index: 1;
  }

  .login-card h2 {
    text-align: center;
    font-weight: 700;
    margin-bottom: 1.6rem;
    color: #e0f2fe;
    letter-spacing: 0.3px;
  }

  /* ✅ Inputs Devzuno style */
  .form-control,
  input {
    width: 100%;
    background: rgba(255, 255, 255, 0.07) !important;
    border: 1px solid rgba(148, 163, 184, 0.25) !important;
    color: #f8fafc !important;
    padding: 10px 12px;
    border-radius: 12px;
    transition: 0.25s ease;
  }

  .form-control:focus,
  input:focus {
    outline: none;
    border: 1px solid rgba(56, 189, 248, 0.7) !important;
    box-shadow: 0 0 0 0.25rem rgba(56, 189, 248, 0.25) !important;
    background: rgba(255, 255, 255, 0.10) !important;
  }

  label {
    color: rgba(226, 232, 240, 0.9);
    font-weight: 500;
    margin-bottom: 6px;
    display: block;
  }

  /* ✅ Password Input + Show Button wrapper */
  .password-field {
    position: relative;
  }

  .password-field input {
    padding-right: 70px !important; /* ✅ Show button ke liye space */
  }

  .toggle-btn {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: transparent;
    border: none;
    color: #7dd3fc;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.9rem;
    padding: 0;
  }

  .toggle-btn:hover {
    color: #38bdf8;
  }

  .btn-login {
    background: linear-gradient(90deg, #38bdf8, #2563eb);
    color: #ffffff;
    width: 100%;
    padding: 0.7rem;
    border-radius: 14px;
    font-weight: 600;
    border: none;
    transition: 0.3s ease;
    box-shadow: 0 10px 25px rgba(37, 99, 235, 0.25);
  }

  .btn-login:hover {
    background: linear-gradient(90deg, #2563eb, #38bdf8);
    transform: translateY(-2px);
    box-shadow: 0 12px 30px rgba(56, 189, 248, 0.28);
  }

  .link-group {
    text-align: center;
    margin-top: 1.2rem;
  }

  .link-group a {
    color: #7dd3fc;
    text-decoration: none;
    font-size: 0.95rem;
    font-weight: 500;
    transition: 0.2s ease;
  }

  .link-group a:hover {
    text-decoration: underline;
    color: #38bdf8;
  }

  .errorlist {
    list-style: none;
    padding: 0;
    margin: 0.5rem 0 1rem;
    color: #fecaca;
    font-size: 0.9rem;
  }
</style>

<div class="login-wrapper">
  <div class="login-card">
    <h2>Client Login</h2>

    <form method="post">
      {% csrf_token %}

      <!-- ✅ Username (manual) -->
      <p>
        <label for="id_username">Username:</label>
        {{ form.username }}
      </p>

      <!-- ✅ Password (manual with show button inside input) -->
      <p>
        <label for="id_password">Password:</label>
        <div class="password-field">
          {{ form.password }}
          <button type="button" class="toggle-btn" onclick="togglePassword()">Show</button>
        </div>
      </p>

      <button class="btn btn-login mt-3" type="submit">Login</button>

      <div class="link-group">
        <a href="/client/otp/request/">Forgot Password?</a><br>
        <a href="/client/register/">Create a new account</a>
      </div>
    </form>
  </div>
</div>

<script>
  document.body.classList.add("login-page");

  function togglePassword() {
    let passInput = document.querySelector('#id_password');
    let btn = document.querySelector(".toggle-btn");

    if (!passInput) return;

    if (passInput.type === "password") {
      passInput.type = "text";
      btn.innerText = "Hide";
    } else {
      passInput.type = "password";
      btn.innerText = "Show";
    }
  }
</script>

{% endblock %}
