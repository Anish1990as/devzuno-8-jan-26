{% extends 'base.html' %}
{% block content %}

<style>
  /* Remove page background override */
  body.login-page {
    background: linear-gradient(135deg, #0f172a, #1e293b) !important;
  }

  /* Center only this container, not whole body */
  .login-wrapper {
    min-height: calc(100vh - var(--dvz-nav-height) - var(--dvz-footer-height));
    display: flex;
    justify-content: center;
    align-items: center;
    padding-bottom: 20px;
  }

  .login-card {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 20px;
    padding: 2.5rem;
    width: 380px;
    color: #f8fafc;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
  }

  .login-card h2 {
    text-align: center;
    font-weight: 600;
    margin-bottom: 1.5rem;
    color: #f1f5f9;
  }

  .form-control {
    background-color: rgba(255, 255, 255, 0.18);
    border: none;
    color: #f8fafc;
  }
  .form-control:focus {
    background-color: rgba(255, 255, 255, 0.28);
    box-shadow: 0 0 0 0.25rem rgba(59, 130, 246, 0.4);
  }

  .btn-login {
    background: linear-gradient(90deg, #2563eb, #1d4ed8);
    color: white;
    width: 100%;
    padding: 0.6rem;
    border-radius: 10px;
    font-weight: 500;
    border: none;
    transition: 0.3s ease;
  }
  .btn-login:hover {
    background: linear-gradient(90deg, #1d4ed8, #2563eb);
    transform: translateY(-2px);
  }

  .link-group {
    text-align: center;
    margin-top: 1rem;
  }
  .link-group a {
    color: #93c5fd;
    text-decoration: none;
    font-size: 0.95rem;
  }
  .link-group a:hover {
    text-decoration: underline;
    color: #60a5fa;
  }
</style>

<div class="login-wrapper">
  <div class="login-card">
    <h2>Client Login</h2>

    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}

      <button class="btn btn-login mt-3">Login</button>

      <div class="link-group">
        <a href="/client/otp/request/">Forgot Password?</a><br>
        <a href="/client/register/">Create a new account</a>
      </div>
    </form>
  </div>
</div>

<script>
  // mark page as login for body background
  document.body.classList.add("login-page");
</script>

{% endblock %}
