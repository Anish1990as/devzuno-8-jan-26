{% extends 'base.html' %}
{% block content %}
<div class="reset-card">
  <h2>Reset Your Password</h2>
  <p>Enter your new password below.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn-reset">Change Password</button>
  </form>
</div>
{% endblock %}
