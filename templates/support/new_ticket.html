{% extends 'base.html' %}
{% load static %}
{% block content %}

<section class="py-4 dvz-surface">
  <div class="container">

    <!-- Header -->
    <div class="mb-4 text-center">
      <h3 class="fw-bold text-gradient mb-1">Create New Support Ticket</h3>
      <p class="text-muted mb-0">Describe your issue and our team will get back to you soon.</p>
    </div>

    <!-- Ticket Form -->
    <div class="dvz-card mx-auto p-4 shadow-sm" style="max-width:700px;">
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <input type="hidden" name="form_kind" value="create_ticket">

        <div class="row g-3">
          <div class="col-md-8">
            <label class="form-label fw-semibold text-muted">Subject</label>
            <input type="text" name="subject" class="form-control dvz-input" placeholder="Brief summary" required>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold text-muted">Department</label>
            <select name="department" class="form-select dvz-input">
              <option value="General">General</option>
              <option value="Billing">Billing</option>
              <option value="Technical">Technical</option>
              <option value="Sales">Sales</option>
            </select>
          </div>

          <div class="col-md-4">
            <label class="form-label fw-semibold text-muted">Priority</label>
            <select name="priority" class="form-select dvz-input">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>

          <div class="col-12">
            <label class="form-label fw-semibold text-muted">Message</label>
            <textarea name="message" class="form-control dvz-input" rows="6" placeholder="Describe your issue..." required></textarea>
          </div>

          <div class="col-12">
            <label class="form-label fw-semibold text-muted">Attachment (optional)</label>
            <input type="file" name="attachment" class="form-control dvz-input" accept=".png,.jpg,.jpeg,.pdf,.zip,.txt,.log">
            <div class="form-text text-muted">Max size: 5MB</div>
          </div>
        </div>

        <div class="mt-4 d-flex justify-content-end gap-2">
          <a href="{% url 'accounts:tickets' %}" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
          <button type="submit" class="btn dvz-btn-gradient px-4 rounded-pill fw-semibold">Submit Ticket</button>
        </div>
      </form>
    </div>

  </div>
</section>

<!-- ============== STYLE ============== -->
<style>
  .dvz-surface{
    background: linear-gradient(180deg,#e8fff6 0%, #fafffc 100%);
    border-radius: 16px;
    min-height: calc(100vh - 120px);
    padding-bottom: 50px;
  }

  .text-gradient{
    background: linear-gradient(90deg,#00b37d,#2dd4bf,#00b37d);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .dvz-card{
    background: #fff;
    border: 1px solid #e6f5ef;
    border-radius: 18px;
    box-shadow: 0 8px 30px rgba(0,179,125,.08);
  }

  .dvz-input{
    height: 48px;
    border-radius: 12px;
    background: #fff;
    border: 1px solid #d5f0e6;
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  .dvz-input:focus{
    border-color: #00b37d;
    box-shadow: 0 0 0 .25rem rgba(0,179,125,.15);
  }
  textarea.dvz-input{ height: auto; min-height: 120px; }

  .dvz-btn-gradient{
    background: linear-gradient(90deg,#00c896,#34d399);
    color:#fff;
    border:none;
    border-radius:12px;
    box-shadow:0 6px 16px rgba(0,200,150,.25);
  }
  .dvz-btn-gradient:hover{ filter: brightness(1.05); }

  .form-label{ font-size: 0.95rem; }
</style>

{% endblock %}
